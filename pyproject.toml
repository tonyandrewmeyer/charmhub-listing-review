[build-system]
requires = ["uv-build>=0.7,<1"]
build-backend = "uv_build"

[project]
name = "charmhub-listing-review"
version = "1.0.0"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name="The Charm Tech team at Canonical Ltd."},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "PyYAML==6.*",
]

[dependency-groups]
lint = [
    "ruff~=0.11",
    "codespell~=2.4",
    "ty",
    "typing_extensions~=4.2",
    "zizmor~=1.26",
]
unit = [
    "pytest~=9.0",
    "coverage[toml]~=7.0",
]
security = [
    "pip-audit~=2.7",
]

[project.scripts]
update-issue = "charmhub_listing_review.update_issue:main"
self-review = "charmhub_listing_review.self_review:main"

# uv configuration
[tool.uv]
# Only resolve to packages published at least 7 days ago, to give a small
# window for freshly-published bad releases (broken builds, supply-chain
# incidents, yanked versions) to be noticed before we pick them up.
exclude-newer = "7 days"

# Testing tools configuration
[tool.pytest.ini_options]
# Promote warnings (deprecations, resource-cleanup leaks, and so on) to errors so
# they surface in CI rather than going unnoticed.
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

# Formatting tools configuration
[tool.autopep8]
max-line-length = 99
ignore = ["W503"]
recursive = true
jobs = -1
aggressive = 3

# Linting tools configuration
[tool.ruff]
line-length = 99
target-version = "py312"

# Ruff formatter configuration
[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E",
    "W",
    # isort
    "unsorted-imports",
    # pep8-naming
    "N",
    # flake8-builtins
    "A",
    # flake8-copyright
    "CPY",
    # pyupgrade
    "UP",
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # Ruff specific
    "RUF",
    # Perflint
    "PERF",
    # pyflakes-docstrings
    "D",
    # flake8-future-annotations
    "FA",
    # flake8-type-checking
    "TC",
]
ignore = [
    # Move application import into a type-checking block
    "typing-only-first-party-import",
    # Move third-party import into a type-checking block
    "typing-only-third-party-import",
    # Move standard library import into a type-checking block
    "typing-only-standard-library-import",
    # Use of `assert` detected
    "assert",

    # Return condition directly, prefer readability.
    "needless-bool",
    # Use contextlib.suppress() instead of try/except: pass
    "suppressible-exception",
    # Use a single `with` statement with multiple contexts instead of nested `with` statements
    "multiple-with-statements",

    # Missing docstring in magic method
    "undocumented-magic-method",
    # Missing docstring in `__init__`
    "undocumented-public-init",

    # Manual dict comprehension.
    "manual-dict-comprehension",

    # Subprocess calls - not using an absolute path, and having some user content.
    # There's a lot of calls to `gh` in the core processing here, and the code
    # typically runs in CI, which mitigates most of the risk. We're rather just
    # be careful and consider the risks of each call without having to scatter
    # noqa's around.
    "subprocess-without-shell-equals-true",
    "start-process-with-partial-path",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    # All documentation linting.
    "D",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["id", "min", "map", "range", "type", "input", "format"]

[tool.codespell]
quiet-level = 3
