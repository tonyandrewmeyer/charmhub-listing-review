summary: Self-review correctly identifies failures in a badly formed charm
systems:
  - ubuntu-24.04

execute: |
  pushd "${SPREAD_PATH}/${SPREAD_TASK}"

  # Create a failing test charm fixture.
  CHARM_DIR=$(mktemp -d)
  bash "$SPREAD_PATH"/tests/spread/lib/create-test-charm.sh "$CHARM_DIR" failing

  # Run self-review against the badly formed charm.
  output=$(uv run --directory "$SPREAD_PATH" \
    self-review \
      --charm-name "Bad_Charm_Name" \
      --repository "file://$CHARM_DIR" 2>&1) || true

  echo "$output"

  # Should report 0 passed and multiple failures.
  echo "$output" | MATCH "0 passed"
  echo "$output" | MATCH "[0-9]+ failed"

  # Icon is a soft requirement: a missing icon should not be a hard failure,
  # it should stay as a manual-review item (❓).
  echo "$output" | MATCH "❓.*icon"

  # Lock file and requires-python are "Best practices" items fetched live from
  # canonical/operator's best-practices.txt. They used to stay at manual review
  # because the fetched text carried no id the matcher could key off; the :name:
  # anchors from canonical/operator#2524 landed 2026-08-16 and this branch parses
  # them, so both now resolve for real. This fixture has neither, so both fail.
  echo "$output" | MATCH "❌.*lock file" || echo "$output" | MATCH "❌.*committed to version control"
  echo "$output" | MATCH "❌.*requires-python"

restore: |
  rm -rf "${CHARM_DIR:-}" 2>/dev/null || true
