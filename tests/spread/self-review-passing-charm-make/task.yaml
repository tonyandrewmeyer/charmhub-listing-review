summary: Self-review CLI runs against a well-formed charm that uses make for tooling
systems:
  - ubuntu-24.04

execute: |
  pushd "${SPREAD_PATH}/${SPREAD_TASK}"

  # Create a passing test charm fixture. The directory name is the repository
  # name as far as the repository_name check is concerned (it reads the last
  # path segment of --repository), so a bare mktemp -d would fail a check that
  # has nothing to do with the charm's contents.
  CHARM_PARENT=$(mktemp -d)
  CHARM_DIR="$CHARM_PARENT/test-charm-operator"
  bash "$SPREAD_PATH"/tests/spread/lib/create-test-charm.sh "$CHARM_DIR" passing-make

  # Run self-review pointing at the local file:// repo.
  output=$(uv run --directory "$SPREAD_PATH" \
    self-review \
      --charm-name test-charm \
      --repository "file://$CHARM_DIR" \
      --ci-linting-url "file://$CHARM_DIR/Makefile" 2>&1) || true

  echo "$output"

  # Verify the tool ran and produced output for this charm.
  echo "$output" | MATCH "test-charm"

  # File-based checks should pass.
  echo "$output" | MATCH "✅.*icon"

  # Lock file and requires-python are "Best practices" items, checked against
  # best-practices.txt fetched live from canonical/operator: these can fail
  # because that file changed, not because this repo did.
  echo "$output" | MATCH "✅.*lock file" || echo "$output" | MATCH "✅.*committed to version control"
  echo "$output" | MATCH "✅.*requires-python"

  # Progress summary should be present and show passes.
  echo "$output" | MATCH "Progress:.*passed"

  # Should report 0 failed (HTTP checks fall back to manual, not failed).
  echo "$output" | MATCH "0 failed"

restore: |
  rm -rf "${CHARM_PARENT:-}" 2>/dev/null || true
