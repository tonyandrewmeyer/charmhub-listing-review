name: Remind reviewers

# Daily reminder for stalled listing-request issues. The `remind` script
# looks at every open listing-request issue, decides whether it has gone
# quiet, and posts (or escalates) a reminder pinging the current assignees.

on:
  schedule:
    # 07:00 UTC each weekday (early European morning). Skipped on weekends
    # to avoid pinging reviewers when nobody would act on it anyway.
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'If true, print reminders to the job log without posting.'
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      # `issues: write` is needed to post the reminder comments.
      issues: write
      contents: read
    steps:
      - name: Check out repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0

      - name: Post reminders
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: |
          uv venv
          uv pip install .
          uv run remind --repo "${{ github.repository }}" $DRY_RUN
