name: Close Stale Requests

on:
  schedule:
    # Daily, so a warning is never more than a day late and the close-after
    # window (a couple of days) has enough resolution to be meaningful.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  close-stale-requests:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      - name: Close stale listing requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv venv
          uv pip install .
          uv run close-stale-requests --repo "${{ github.repository }}"
